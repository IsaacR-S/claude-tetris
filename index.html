<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" title="Cambiar modo claro/oscuro" aria-label="Cambiar modo claro/oscuro">☀️</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box" id="gameover-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="menu-btn">Reiniciar</button>
      </div>

      <div class="overlay-box" id="pause-box">
        <div id="pause-main" class="overlay-box">
          <p class="pause-title">PAUSA</p>
          <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn secondary" type="button">Reiniciar</button>
          <button id="controls-btn" class="menu-btn secondary" type="button">Ver controles</button>
          <div class="level-select">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-stepper">
              <button id="level-down" class="step-btn" type="button" aria-label="Bajar nivel inicial">−</button>
              <span id="start-level" class="value">1</span>
              <button id="level-up" class="step-btn" type="button" aria-label="Subir nivel inicial">+</button>
            </div>
          </div>
        </div>

        <div id="pause-controls" class="overlay-box hidden">
          <p class="pause-title">CONTROLES</p>
          <ul class="controls-list">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
          </ul>
          <button id="controls-back-btn" class="menu-btn secondary" type="button">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
